<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div></div>
    <div class="cronometro">
  <h1 id="display">00:00:00</h1>
  <span id="start"></span>
  <span id="pause"></span>
  <span id="reset"></span>
</div>



    <script>
			
			  let pausar = document.querySelector('#pause')
			  let reset = document.querySelector('#reset')
			  let iniciar = document.querySelector('#start')
        screen.orientation.addEventListener("change", (event) => {
          const type = event.target.type;
          const angle = event.target.angle;  
                   if (angle == 90){
                    pausar = pausarCronometro();
                  } else if (angle == 270){
                  reset = zerarCronometro() 
                  } else{
                  iniciar = iniciarCronometro()
                }
            });
let [horas, minutos, segundos] = [0, 0, 0];
let display = document.getElementById('display');
let intervalo = null;

document.getElementById('start').addEventListener('load', iniciarCronometro);
document.getElementById('pause').addEventListener('load', pausarCronometro);
document.getElementById('reset').addEventListener('load', zerarCronometro);

function iniciarCronometro() {
  if (intervalo !== null) return; // Evita múltiplos intervalos simultâneos
  intervalo = setInterval(atualizarTempo, 1000);
}

iniciar = iniciarCronometro()

function pausarCronometro() {
    clearInterval(intervalo);
    intervalo = null;
}

function zerarCronometro() {
  pausarCronometro();
  [horas, minutos, segundos] = [0, 0, 0];
  display.innerHTML = '00:00:00';
}

function atualizarTempo() {
  segundos++;
  if (segundos / 60 === 1) {
    segundos = 0;
    minutos++;
    if (minutos / 60 === 1) {
      minutos = 0;
      horas++;
    }
  }

  // Formata a exibição para sempre ter 2 dígitos
  let s = segundos < 10 ? '0' + segundos : segundos;
  let m = minutos < 10 ? '0' + minutos : minutos;
  let h = horas < 10 ? '0' + horas : horas;

  display.innerHTML = `${h}:${m}:${s}`;
}



    </script>
</body>

</html>
