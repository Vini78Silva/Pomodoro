<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div></div>
    <p id="spanRelogio" onload="relogio()"></p>


    <script>
			
			  let paragrafo = document.querySelector('#spanRelogio')
          	  screen.orientation.addEventListener("change", (event) => {
              const type = event.target.type;
              const angle = event.target.angle;
  
			  paragrafo.textContent = (`New orientation: ${type} ${angle} degrees`);
            });


    </script>
</body>

</html>
